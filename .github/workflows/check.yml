name: Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
  pull_request:
    paths-ignore:
      - '*.md'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5

      - name: Ktfmt
        run: ./gradlew ktfmtCheck

      - name: Unit Tests
        run: ./gradlew test -x :ide-plugin:test

      - name: Build Health
        run: ./gradlew buildHealth

      - name: Lint
        run: ./gradlew lint -x :ide-plugin:lint

      - name: Check CLI Publication
        run: |
          # Publish to Maven local
          ./gradlew :cli:publishToMavenLocal
          # Extract version dynamically from gradle.properties
          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          # Extract the published zip
          cd ~/.m2/repository/xyz/block/artifactswap/cli/${VERSION}
          unzip -q cli-${VERSION}.zip
          # Test the CLI from the extracted distribution (end-to-end test)
          ./artifactswap-${VERSION}/bin/artifactswap --help

  ide-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      # Free disk space to avoid running into "No space left on device" errors
      # when downloading multiple versions of IntelliJ for plugin verification
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          # This step takes several minutes and doesn't save that much space
          large-packages: false

      - name: Set up JDK 21
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5

      - name: Verify IDE Plugin
        run: ./gradlew :ide-plugin:verifyPlugin
