name: Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
  pull_request:
    paths-ignore:
      - '*.md'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up JDK 17
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5

      - name: Ktfmt
        run: ./gradlew ktfmtCheck

      - name: Unit Tests
        run: ./gradlew test

      - name: Build Health
        run: ./gradlew buildHealth

      - name: Lint
        run: ./gradlew lint

      - name: Check CLI Publication
        run: |
          # Publish to Maven local
          ./gradlew :cli:publishToMavenLocal
          # Extract version dynamically from gradle.properties
          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          # Extract the published zip
          cd ~/.m2/repository/xyz/block/artifactswap/cli/${VERSION}
          unzip -q cli-${VERSION}.zip
          # Test the CLI from the extracted distribution (end-to-end test)
          ./artifactswap-shadow-${VERSION}/bin/artifactswap --help

