name: Publish

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v2.1.3, etc.
    branches:
      - main  # Also allow manual publishing from main branch

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  maven-central:
    if: github.repository == 'block/artifact-swap'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag or use default
        id: version
        run: |
          # Check if this is a tag push
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Remove 'v' prefix from tag to get version (e.g., v1.0.0 -> 1.0.0)
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "use_tag_version=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Publishing with tag version: $VERSION"
          else
            # Use version from gradle.properties
            echo "use_tag_version=false" >> $GITHUB_OUTPUT
            echo "Publishing with gradle.properties version"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central
        run: |
          if [[ "${{ steps.version.outputs.use_tag_version }}" == "true" ]]; then
            ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache -Pversion=${{ steps.version.outputs.version }}
          else
            ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache
          fi
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SECRET_PASSPHRASE }}
